# Optional local Postgres for development.
# Production uses Neon — set NEON_DATABASE_URL in .env instead.
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
      POSTGRES_DB: youtube_pipeline
    volumes:
      - pipeline_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d youtube_pipeline"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pipeline_pg_data:
